<svg viewBox="0 0 228 190" xmlns="http://www.w3.org/2000/svg" width="228" height="190">
    <rect width="228" height="190" fill="#1a1a2e" rx="12"/>
    <defs>
        <filter id="card-shadow" x="-15%" y="-15%" width="130%" height="130%">
            <feDropShadow dx="1.5" dy="1.5" stdDeviation="2" flood-color="#000" flood-opacity="0.22"/>
        </filter>
        <filter id="table-shadow" x="-5%" y="-15%" width="110%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
        </filter>
        <radialGradient id="table-felt" cx="50%" cy="40%" r="55%">
            <stop offset="0%" stop-color="#2e72c9"/>
            <stop offset="60%" stop-color="#1a4f9c"/>
            <stop offset="100%" stop-color="#0d3264"/>
        </radialGradient>
    </defs>

    <!-- Casino table — horizontal oval, dark rail + blue felt -->
    <ellipse cx="114" cy="148" rx="112" ry="52" fill="#081b38" filter="url(#table-shadow)"/>
    <ellipse cx="114" cy="145" rx="109" ry="49" fill="#12306a"/>
    <ellipse cx="114" cy="144" rx="106" ry="46" fill="url(#table-felt)"/>

    <!-- A♠ — far left, rotated -30° -->
    <g transform="translate(42,114) rotate(-30)" filter="url(#card-shadow)">
        <rect x="-24" y="-34" width="48" height="68" rx="3.5" fill="white" stroke="#D1D5DB" stroke-width="1"/>
        <text x="-17" y="-19" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#111827">A</text>
        <text x="-17" y="-8" font-family="Georgia, serif" font-size="9" fill="#111827">♠</text>
        <text x="0" y="9" font-family="Georgia, serif" font-size="22" fill="#111827" text-anchor="middle" dominant-baseline="middle">♠</text>
    </g>

    <!-- K♥ — left, rotated -15° -->
    <g transform="translate(77,100) rotate(-15)" filter="url(#card-shadow)">
        <rect x="-24" y="-34" width="48" height="68" rx="3.5" fill="white" stroke="#D1D5DB" stroke-width="1"/>
        <text x="-17" y="-19" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#DC2626">K</text>
        <text x="-17" y="-8" font-family="Georgia, serif" font-size="9" fill="#DC2626">♥</text>
        <text x="0" y="9" font-family="Georgia, serif" font-size="22" fill="#DC2626" text-anchor="middle" dominant-baseline="middle">♥</text>
    </g>

    <!-- J♣ — center, upright -->
    <g transform="translate(114,95) rotate(0)" filter="url(#card-shadow)">
        <rect x="-24" y="-34" width="48" height="68" rx="3.5" fill="white" stroke="#D1D5DB" stroke-width="1"/>
        <text x="-17" y="-19" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#111827">J</text>
        <text x="-17" y="-8" font-family="Georgia, serif" font-size="9" fill="#111827">♣</text>
        <text x="0" y="9" font-family="Georgia, serif" font-size="22" fill="#111827" text-anchor="middle" dominant-baseline="middle">♣</text>
    </g>

    <!-- Q♦ — right, rotated +15° -->
    <g transform="translate(151,100) rotate(15)" filter="url(#card-shadow)">
        <rect x="-24" y="-34" width="48" height="68" rx="3.5" fill="white" stroke="#D1D5DB" stroke-width="1"/>
        <text x="-17" y="-19" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#DC2626">Q</text>
        <text x="-17" y="-8" font-family="Georgia, serif" font-size="9" fill="#DC2626">♦</text>
        <text x="0" y="9" font-family="Georgia, serif" font-size="22" fill="#DC2626" text-anchor="middle" dominant-baseline="middle">♦</text>
    </g>

    <!-- 10♠ — far right, rotated +30° -->
    <g transform="translate(186,114) rotate(30)" filter="url(#card-shadow)">
        <rect x="-24" y="-34" width="48" height="68" rx="3.5" fill="white" stroke="#D1D5DB" stroke-width="1"/>
        <text x="-17" y="-19" font-family="Georgia, serif" font-size="9" font-weight="bold" fill="#111827">10</text>
        <text x="-17" y="-8" font-family="Georgia, serif" font-size="9" fill="#111827">♠</text>
        <text x="0" y="9" font-family="Georgia, serif" font-size="22" fill="#111827" text-anchor="middle" dominant-baseline="middle">♠</text>
    </g>
</svg>
